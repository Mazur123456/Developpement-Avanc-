name: CI pipeline for MasterAnnonce

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        # Run clean verify WITHOUT skipping tests. Testcontainers will handle the DB.
        run: mvn -B clean verify

      - name: Upload JAR Artifact
        # Only upload for Java 17 (the main targeted runtime)
        if: matrix.java-version == '17'
        uses: actions/upload-artifact@v4
        with:
          name: master-annonce-jar
          path: target/*.jar

      - name: Upload JaCoCo Coverage Report (Bonus 3)
        # Only upload for Java 17 to avoid duplication
        if: matrix.java-version == '17'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    # Seulement lors des push sur 'main' (après vérification des tests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t master-annonce:latest .
